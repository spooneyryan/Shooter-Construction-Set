# Build and deploy for Starline, standalone on its own Azure Static Web App.
#
# Static Web Apps is the whole hosting story: the build is a pure static
# export — no server rendering, no API routes, state in localStorage — so
# there is nothing for an App Service to run. The Free tier carries it.
#
# This build targets the SWA's *root*, so the STARLINE_* knobs below override
# the source defaults, which still point at the arcade's /games/starline/
# staging. The earlier arcade-tenant pipeline (publish an overlay artifact,
# wake the shared deploy) is in git history at 224cb96 if the game ever moves
# back in with the other games.
#
# Target: the "shmup" Static Web App. Its deployment token is already held in
# the secret pipeline variable SWA_DEPLOYMENT_TOKEN, and its address is in
# STARLINE_PUBLIC_URL below.
#
# What is still outside this file:
#   - Reader on the GameBase feed for this project's build service, so
#     npmAuthenticate can restore the @ccllc packages.
#   - Approvals, if wanted, on the `shmup-production` environment. Referencing
#     it here creates it on the first run; approvals are attached in the
#     environment's own settings.
#   - PR validation, from a branch policy pointing at this pipeline — Azure
#     Repos has no `pr:` trigger in YAML.

trigger:
  branches:
    include:
      - master
      - dev*

variables:
  # Baked into the export at build time (next.config.ts, app/layout.tsx) and
  # read again by tests/rendered-html.test.mjs, so the suite verifies the
  # layout this pipeline actually ships. The empty prefix means "the site
  # root"; the public URL feeds metadataBase for the social-card links.
  STARLINE_PUBLIC_URL: https://wonderful-mushroom-0edd54a0f.7.azurestaticapps.net/

stages:
  - stage: Build
    displayName: Build & verify
    jobs:
      - job: build
        displayName: Install, lint, test
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node 22
            inputs:
              versionSpec: 22.x

          # Writes feed credentials for the @ccllc scope into .npmrc for the
          # duration of the run. A feed in this organization needs no service
          # connection, only Reader for the build service on the GameBase feed.
          - task: npmAuthenticate@0
            displayName: Authenticate GameBase feed
            inputs:
              workingFile: .npmrc

          - script: npm ci
            displayName: Install

          - script: npm run lint
            displayName: Lint

          # `npm test` builds first, then asserts on dist/client — the tree
          # deployed below is the exact one the tests passed against. The
          # empty prefix is set here, on the step, rather than in the
          # variables block: a pipeline variable with an empty value is easy
          # to lose in translation, and this is the one step that must see it.
          - script: npm test
            displayName: Build & test (root asset prefix)
            env:
              STARLINE_ASSET_PREFIX: ""
              STARLINE_PUBLIC_URL: $(STARLINE_PUBLIC_URL)

          # If the empty prefix failed to reach the build, the export mirrors
          # its assets under games/starline/ and the deployed site would 404
          # on every script. The test suite follows the same variable, so it
          # cannot catch that by itself — this can.
          - script: |
              set -euo pipefail
              test -d dist/client/_next || { echo "##vso[task.logissue type=error]dist/client/_next is missing — the root asset prefix did not reach the build"; exit 1; }
            displayName: Assert root layout

          - task: PublishPipelineArtifact@1
            displayName: Publish site artifact
            inputs:
              targetPath: dist/client
              artifact: starline-site

  - stage: Deploy
    displayName: Deploy to Static Web Apps
    dependsOn: Build
    # Every pushed branch builds; only master ships.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: deploy
        displayName: Upload to the Static Web App
        pool:
          vmImage: ubuntu-latest
        environment: shmup-production
        strategy:
          runOnce:
            deploy:
              steps:
                # The deployment job downloads starline-site to
                # $(Pipeline.Workspace)/starline-site automatically; the site
                # is prebuilt, so the task only uploads it.
                - task: AzureStaticWebApp@0
                  displayName: Deploy prebuilt export
                  inputs:
                    cwd: $(Pipeline.Workspace)/starline-site
                    app_location: /
                    skip_app_build: true
                    skip_api_build: true
                    azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
